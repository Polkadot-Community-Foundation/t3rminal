name: Deploy Frontend (devnet)

# Build the static export and publish it to devnet Bulletin, bound to DotNS.
#
#   push to main / workflow_dispatch  → PRODUCTION: publishes the SAME bundle to
#                                       BOTH t3rminal.dot and terminal.dot
#                                       (terminal.dot is an alias on the same CID).
#   pull_request                      → PREVIEW: one pr<N>-t3rminal01.dot name
#                                       (≥9 chars → no PoP gate on DotNS).
#
# The contract leg (T3rminalBulletinIndex) is NOT deployed here. The repo
# variable NEXT_PUBLIC_BULLETIN_INDEX_ADDRESS carries the devnet address
# (0xf94229a0…) so CI bakes it in.
#
# Required repo config:
#   secret  DOTNS_MNEMONIC                     — the uploader account (5Fk8…): OWNS
#                                                both .dot names and holds a live
#                                                devnet Bulletin storage authorization
#                                                (a failed upload? check this first).
#   variable NEXT_PUBLIC_BULLETIN_INDEX_ADDRESS — the devnet contract address.
#   secret  NEXT_PUBLIC_SENTRY_DSN             — optional (empty disables Sentry).
#
# Why these flags:
#   --env devnet   : built into @polkadot-community-foundation/polkadot-app-deploy
#                    (devnet RPCs, DotNS v0.8.0 addresses, dev-dot.li gateway).
#   --mnemonic FLAG: routes storage signing to the AUTHORIZED account (direct
#                    signer). The default pool accounts come from a public phrase
#                    and are NOT Bulletin-authorized — passing the env var alone
#                    is not enough; it must be the FLAG.
#   --config       : the CLI only auto-discovers polkadot-app-deploy.config.*;
#                    ours is bulletin-deploy.config.ts, so without --config the
#                    product-manifest publish is silently skipped.
#   no --publish   : t3rminal is not listed in the browse directory (operator
#                    decision); only the terminal.dot alias is listed, by hand.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      skip-cache:
        description: 'Force redeploy (skip cache)'
        type: boolean
        default: false

permissions:
  contents: read
  pull-requests: write

concurrency:
  # Never cancel a production (on-chain) deploy mid-flight; stale PR previews are
  # safe to supersede.
  group: deploy-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        # npm bug #4828: a lockfile generated on macOS pins macOS-only variants
        # of optional native modules and skips the Linux equivalents (e.g.
        # @rollup/rollup-linux-x64-gnu, which papi imports via rollup). Delete
        # the lockfile and resolve fresh for this platform.
        run: |
          rm -f package-lock.json
          npm install --no-audit --no-fund

      - name: Generate PAPI descriptors
        # .papi/polkadot-api.json points at devnet (Paseo) AH; this regenerates the
        # metadata against it (avoids BadProof at runtime).
        run: npm run papi:generate

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_COMMIT_SHA: ${{ github.sha }}
          NEXT_PUBLIC_SENTRY_DSN: ${{ secrets.NEXT_PUBLIC_SENTRY_DSN }}
          NEXT_PUBLIC_SENTRY_TRACES_SAMPLE_RATE: '1.0'
          # main is the pinned production product; PR deploys go to their own
          # live preview domain (not pinned in the app). Label them distinctly so
          # the Sentry dashboard can separate prod traffic from preview traffic.
          NEXT_PUBLIC_SENTRY_ENVIRONMENT: ${{ github.event_name == 'pull_request' && 'preview' || 'production' }}
          # This workflow is devnet-only — network is fixed here, not via a var.
          NEXT_PUBLIC_NETWORK: devnet
          NEXT_PUBLIC_ASSET_HUB_WS: wss://asset-hub-paseo-rpc.n.dwellir.com
          # Devnet T3rminalBulletinIndex. Unset → config.ts has no address and
          # on-chain reads return empty.
          NEXT_PUBLIC_BULLETIN_INDEX_ADDRESS: ${{ vars.NEXT_PUBLIC_BULLETIN_INDEX_ADDRESS }}

      - name: Setup IPFS
        uses: ipfs/download-ipfs-distribution-action@v1
        with:
          name: kubo
          version: v0.33.0
      - run: ipfs init

      - name: Install deploy tool
        # PCF fork: carries the devnet environment (DotNS v0.8.0 addresses).
        run: npm install -g @polkadot-community-foundation/polkadot-app-deploy@0.16.7

      - name: Deploy
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 20
          max_attempts: 3
          retry_wait_seconds: 30
          # PR  → one preview name. push/dispatch → both prod names on the SAME
          # bundle: build once with the canonical id (t3rminal.dot), deploy it,
          # then deploy terminal.dot against the same out/ — the CLI finds the
          # content already on Bulletin and reuses the CID (terminal.dot is a
          # contenthash alias that also gets its own product manifest).
          command: |
            set -euo pipefail
            if [ "${{ github.event_name }}" = "pull_request" ]; then
              DOMAINS="pr${{ github.event.pull_request.number }}-t3rminal01.dot"
              CANON="pr${{ github.event.pull_request.number }}-t3rminal01.dot"
            else
              DOMAINS="t3rminal.dot terminal.dot"
              CANON="t3rminal.dot"
            fi
            # dot.li manifest id is baked into the bundle — set it to the
            # canonical name once so both prod names ship identical bytes (one CID).
            cp bundle/manifest.toml out/manifest.toml
            sed -i "s/^id *= *\".*\"/id = \"${CANON}\"/" out/manifest.toml
            for DOMAIN in $DOMAINS; do
              echo "::group::deploy $DOMAIN"
              export BULLETIN_DEPLOY_DOMAIN="$DOMAIN"
              # t3rminal must NOT be publicized in the `browse` directory
              # (operator decision): never pass --publish. The .dot content still
              # deploys; it just isn't listed via Publisher.publish. Use the
              # unpublish.yml workflow to remove an existing listing.
              PUBLISH=""
              polkadot-app-deploy ./out "$DOMAIN" \
                --env devnet \
                --mnemonic "$MNEMONIC" \
                --config ./bulletin-deploy.config.ts \
                --no-transfer-to-signedin-user \
                $PUBLISH
              echo "::endgroup::"
            done
        env:
          MNEMONIC: ${{ secrets.DOTNS_MNEMONIC }}
          NODE_OPTIONS: '--max-old-space-size=8192'

      - name: Comment on PR
        # Skip for fork PRs: pull_request from a fork runs with a read-only
        # GITHUB_TOKEN, so the comments API 403s and fails the job.
        if: github.event.pull_request && github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/github-script@v7
        with:
          script: |
            const domain = `pr${{ github.event.pull_request.number }}-t3rminal01`;
            const runUrl = `${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}`;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `**${domain}.dot** · [logs](${runUrl})\n\nhttps://${domain}.dev-dot.li`
            });
